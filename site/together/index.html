<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Listen together · AURA</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=1.0.3">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png?v=1.0.3">
<link rel="icon" type="image/png" sizes="96x96" href="../favicon-96x96.png?v=1.0.3">
<link rel="shortcut icon" href="../favicon.ico?v=1.0.3">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=1.0.3">
<link rel="manifest" href="../site.webmanifest">
<meta name="apple-mobile-web-app-title" content="AURA">
<meta property="og:title" content="Listen together on AURA">
<meta property="og:description" content="Open your invite and listen with friends in real-time Nostr sync.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
:root {
  color-scheme: dark;
  --ink: #0A0A0A;
  --char: #131313;
  --rule: #262626;
  --rule-hi: #3A3A3A;
  --orange: #FF5F26;
  --orange-soft: #FF8759;
  --white: #FAFAFA;
  --muted: #B8B8B8;
  --display: "Antonio", "Arial Narrow", sans-serif;
  --sans: "Archivo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
::selection { background: var(--orange); color: var(--ink); }
html {
  background: var(--ink);
  scrollbar-color: var(--rule-hi) var(--ink);
}
body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--ink);
  color: var(--white);
  font: 400 16px/1.6 var(--sans);
  caret-color: var(--orange);
  font-variant-numeric: tabular-nums;
}
main {
  max-width: 460px;
  width: 100%;
  border: 1px solid var(--rule-hi);
  background: var(--char);
}
.bench-head {
  background: var(--orange);
  color: var(--ink);
  padding: 22px 28px;
  border-bottom: 1px solid var(--ink);
}
.bench-head h1 {
  margin: 0;
  font-family: var(--display);
  font-size: 40px;
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: -0.02em;
}
.bench-body {
  padding: 28px;
}
p { margin: 0 0 16px; color: var(--muted); }
a { color: var(--orange-soft); text-underline-offset: 0.22em; }
#code {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.12em;
  overflow-wrap: anywhere;
  background: var(--ink);
  border: 1px solid var(--rule);
  padding: 12px 14px;
  margin-bottom: 18px;
}
#code:empty { display: none; }
#open {
  display: block;
  background: var(--orange);
  color: var(--ink);
  padding: 15px 18px;
  text-align: center;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-decoration: none;
  margin: 20px 0 12px;
}
#open:hover { background: var(--orange-hover, #FF713E); }
#web {
  display: block;
  border: 1px solid var(--orange);
  color: var(--orange-soft);
  padding: 14px 18px;
  text-align: center;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-decoration: none;
  margin: 0 0 20px;
}
#web:hover { background: rgba(255, 95, 38, 0.12); }
a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
<script>try{const t=JSON.parse(sessionStorage.getItem("aura_theme")||"null");if(t){const s=document.documentElement.style;if(t.color)s.setProperty("--orange",t.color);if(t.soft)s.setProperty("--orange-soft",t.soft);if(t.hover)s.setProperty("--orange-hover",t.hover);if(t.ground)s.setProperty("--theme-ground",t.ground);if(t.surface)s.setProperty("--theme-surface",t.surface);if(t.border)s.setProperty("--theme-border",t.border);}}catch{}</script>
<script src="invite.js" defer></script>
</head>
<body>
<main>
  <div class="bench-head">
    <h1>Listen together</h1>
  </div>
  <div class="bench-body">
    <p id="message">Open this invite in AURA to join your friend's Nostr listening room.</p>
    <p id="code"></p>
    <a id="open" hidden>Open in AURA</a>
    <a id="web" hidden>Join in Web Player</a>
    <p id="help" hidden>The app opens your invitation. Check your display name and tap Join. If the host has approval enabled, they will let you in.</p>
    <p style="margin-bottom:0;font-family:var(--mono);font-size:12.5px">Need AURA on your device? <a href="../">Get AURA →</a></p>
  </div>
</main>
</body>
</html>
